name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  publish:
    # Publish only on pushes to main, and only after the build/tests pass.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify publish credentials are configured
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          if [ -z "$MAVEN_USERNAME" ] || [ -z "$MAVEN_PASSWORD" ]; then
            echo "::error::MAVEN_USERNAME and/or MAVEN_PASSWORD repository secrets are not set; without them the SFTP repository is not registered and 'gradle publish' would silently no-op."
            exit 1
          fi

      - name: Publish
        # Gradle exposes ORG_GRADLE_PROJECT_<name> env vars as project properties, so these
        # satisfy findProperty('mavenU')/findProperty('mavenP') in build.gradle, which is what
        # gates registration of the remote SFTP repository.
        env:
          ORG_GRADLE_PROJECT_mavenU: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenP: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish --no-daemon --stacktrace
